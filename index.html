  <a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply &rarr;</a>${guide(j)}</div>`).join('');
}
[q,role,region,src].forEach(e=>e.addEventListener('input',render));render();
</script></body></html>
